# Validación estructural: YAML y JSON legibles, frontmatter de SKILL.md (name = carpeta,
# description <= 1024), guías con verificado_el, guías enlazadas existentes y calendario coherente.
name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: PyYAML (versión fijada en pyproject.toml)
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['dependency-groups']['validate']))" > "$RUNNER_TEMP/requisitos-validate.txt"
          python -m pip install --only-binary=:all: -r "$RUNNER_TEMP/requisitos-validate.txt"

      - name: YAML, JSON, SKILL.md y guías
        run: python .github/scripts/validate.py

      - name: Calendario fiscal
        run: python skills/tramites-es/scripts/calendario.py validar
