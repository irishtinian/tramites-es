# Guarda de contenido: Unicode invisible, datos personales, dominios nuevos en assets/*.yaml,
# URLs acortadas y ficheros binarios o certificados. Solo biblioteca estándar: no instala nada.
# Un dominio nuevo hace fallar el job a propósito: lo revisa un CODEOWNER (ver .github/content-guard/).
name: content-guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Guarda de contenido
        run: python .github/scripts/content_guard.py
