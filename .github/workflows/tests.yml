# Pruebas (pytest) en Linux y Windows. Sin red en las pruebas, sin navegador y sin secretos.
# Acciones fijadas por SHA; dependencias fijadas en pyproject.toml ([dependency-groups] test).
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Dependencias de prueba (versiones fijadas en pyproject.toml)
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['dependency-groups']['test']))" > "$RUNNER_TEMP/requisitos-test.txt"
          cat "$RUNNER_TEMP/requisitos-test.txt"
          python -m pip install --only-binary=:all: -r "$RUNNER_TEMP/requisitos-test.txt"

      - name: pytest
        run: python -m pytest
