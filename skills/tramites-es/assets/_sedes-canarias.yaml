# Fragmento de assets/sedes.yaml: sedes de Canarias (autonómicas, insulares y municipales de ejemplo).
# Mismo esquema que sedes.yaml, más la clave `plataforma` (slug de references/plataforma-<slug>.md, o `propia`).
# sede.py y buscar.py cargan juntos sedes.yaml y todos los assets/_sedes-*.yaml (no hace falta fusionar).
# Sin datos personales. Fuente: mapeo en vivo del 15-10-2026 (solo lectura; con certificado solo para consultas)
# y las guías citadas en cada sede.
#
# origins: esquema + host, sin ruta. Son los hosts a los que sede.py presentará el certificado.
#          Los flujos Cl@ve necesitan https://pasarela-ident.clave.gob.es (allí se pide el certificado).
# riesgo:  leer     = consulta o listado, sin efectos (abrir una notificación ya es el acto comparecer);
#          preparar = se prepara sin efectos; el último paso es un acto;
#          actuar   = firma, presenta, paga, domicilia, abre notificaciones o confirma/cambia datos: actos que el
#                     agente hace si su usuario le ha dado ese permiso (SKILL.md; sede.py --permitir).
# estado:  verificado_con_certificado = recorrido con certificado hasta el punto donde para el agente;
#          verificado_sin_certificado = no necesita sesión y se recorrió hasta el punto de parada;
#          parcial   = la URL de entrada está verificada, pero la parte con sesión (o la de la persona) no se recorrió entera;
#          pendiente = solo inventariado o tomado de otras fuentes, sin recorrer.

