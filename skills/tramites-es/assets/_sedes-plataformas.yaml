# Fragmento para assets/sedes.yaml: municipios de ejemplo de las recetas de plataforma + REG/SIR.
# Mismo esquema que sedes.yaml, más la clave `plataforma` (slug de references/plataforma-<slug>.md).
# Mapeo público SIN certificado del 2026-10-15: lo de dentro de la sesión está pendiente de verificación.
# origins: solo dominios de Administraciones públicas, con la evidencia en el comentario.
#   Ningún host de esta lista pide certificado en el handshake (tls-probe/cert-probe).
#   pasarela-ident.clave.gob.es lo pide por ruta en la rama "DNIe / Certificado" de Cl@ve;
#   en el resto, dónde se pide queda pendiente de verificación con certificado.
# riesgo: leer | preparar | actuar  (actuar = acto con efectos: firma, presenta, paga, abre notificaciones,
#         cambia datos o pide cita; el agente lo hace según los permisos que le dé su usuario)
# estado: verificado_sin_certificado | parcial | pendiente_con_certificado | bloqueado_por_sede
# Los IDs de trámite son LOCALES de cada municipio: no se copian a otro.
# verificado_el va entre comillas: sin ellas YAML lo lee como fecha y buscar.py no puede serializarlo a JSON.
sedes:

  reg-age:
    nombre: "Registro Electrónico General de la AGE (REG) + SIR"
    nivel: estatal
    login: "https://reg.redsara.es/es/login"
    origins:
      - "https://reg.redsara.es"                 # sin mTLS; "Nuevo registro" -> /es/login -> Cl@ve
      - "https://pasarela.clave.gob.es"          # selector de Cl@ve; no pide certificado
      - "https://pasarela-ident.clave.gob.es"    # pide el certificado (IdP2/AuthenticateCitizen)
    guia: references/registro-reg-sir.md
    verificado_el: "2026-10-15"
    tramites:
      - id: reg-instancia-general
        nombre: "Instancia general a cualquier administración"
        alias: ["instancia general", "registro", "presentar escrito ayuntamiento", "solicitud genérica", "escrito administración", "registro electrónico general", "SIR"]
        riesgo: preparar
        url: "https://reg.redsara.es/es/login"
        guia: references/registro-reg-sir.md
        estado: verificado_sin_certificado

