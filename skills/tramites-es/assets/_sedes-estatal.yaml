# Fragmento de assets/sedes.yaml: sedes ESTATALES (AEAT, Seguridad Social, DEHú, Cl@ve, DGT,
# Carpeta Ciudadana, Justicia, Catastro). Mismo esquema que sedes.yaml.
# sede.py y buscar.py cargan juntos sedes.yaml y todos los assets/_sedes-*.yaml (no hace falta fusionar).
# Sin datos personales. Fuente: mapeo en vivo del 15-10-2026 (fases 1 y 2 y ronda 3; con certificado de
# persona física solo para consultas; nada firmado, presentado, pagado ni abierto) y las guías citadas.
#
# login:   URL verificada que lleva al punto donde se pide el certificado (directo o vía Cl@ve / pasarela SS).
# origins: esquema + host, sin ruta. SOLO los hosts que piden el certificado (verificados con cert-probe y con sesión).
#          sede.py añade además el origin de la URL de login. Los flujos Cl@ve lo piden en pasarela-ident.clave.gob.es.
# riesgo:  leer     = consulta o listado (notificaciones: listar, nunca abrir);
#          preparar = el agente prepara y el último paso (emitir/confirmar, sin firma) lo da la persona,
#                     o el agente con su OK explícito para ese documento si sede.py no lo bloquea;
#          persona  = firma, presenta, paga, abre notificaciones o cambia datos: siempre la persona.
# estado:  verificado_con_certificado = recorrido con certificado hasta el punto donde para el agente;
#          verificado_sin_certificado = no necesita sesión y se recorrió;
#          parcial   = acceso o primera pantalla verificados, pero no el resultado;
#          pendiente = sin recorrer con certificado (o fallo abierto que lo impide).
# Las URL con <...> son plantillas: sustituye el marcador antes de usarlas.

