  - {id: regla-regularizacion-reta, texto: "Regularización anual de cuotas: si sale a ingresar, el plazo acaba el último día del mes siguiente a la notificación (después, recargo del 10 % y luego del 20 %); si sale a devolver, la TGSS devuelve de oficio antes del 30 de abril.", fuentes: [tgss-guia]}
