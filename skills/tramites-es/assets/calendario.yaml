# Calendario fiscal del autónomo: ÚNICA fuente de fechas de tramites-es.
# references/calendario-fiscal.md y scripts/calendario.py derivan de este fichero.
# Si cambias una fecha aquí, cambia también la tabla del .md y pasa `uv run scripts/calendario.py validar`.
#
# Estados:
#   verificado    -> la fecha aparece literalmente en la fuente oficial citada.
#   regla         -> fecha calculada con la regla literal de la norma u organismo citado más la regla
#                    de días inhábiles. Es un plazo, pero hay que confirmarlo cuando salga el calendario
#                    oficial del año (la AEAT suele publicarlo en diciembre).
#   no_verificado -> sin fuente primaria comprobada. NO es un plazo; `fecha` es solo orientativa.
# Sin datos personales. Fechas en formato AAAA-MM-DD.

version: 1
verificado_el: 2026-10-15
cobertura:
  desde: 2026-10-01
  hasta: 2027-12-31

territorios:
  comun:    {nombre: "Territorio común (península y Baleares)", cobertura: completa}
  canarias: {nombre: "Canarias (IGIC en la ATC; IRPF y retenciones en la AEAT)", cobertura: completa}
  ceuta:    {nombre: "Ceuta", cobertura: parcial,
             aviso: "Solo AEAT (IRPF, retenciones) y Seguridad Social. El IPSI (en lugar del IVA) no está cubierto: consulta la ciudad autónoma."}
  melilla:  {nombre: "Melilla", cobertura: parcial,
             aviso: "Solo AEAT (IRPF, retenciones) y Seguridad Social. El IPSI (en lugar del IVA) no está cubierto: consulta la ciudad autónoma."}
  navarra:  {nombre: "Navarra (Hacienda Foral)", cobertura: parcial,
             aviso: "Solo el 3T de 2026 de Hacienda Foral está verificado. El resto: calendario oficial de Navarra.",
             enlace: "https://www.navarra.es/es/hacienda/calendario-fiscal"}
  bizkaia:  {nombre: "Bizkaia (Hacienda Foral)", cobertura: ninguna,
             aviso: "Calendario foral no verificado. Solo se incluye la Seguridad Social (estatal).",
             enlace: "https://www.batuz.eus/es/inicio"}
  gipuzkoa: {nombre: "Gipuzkoa (Hacienda Foral)", cobertura: ninguna,
             aviso: "Calendario foral no verificado (la página oficial lo carga dinámicamente). Solo se incluye la Seguridad Social.",
             enlace: "https://www.gipuzkoa.eus/es/web/ogasuna/calendario-fiscal"}
  alava:    {nombre: "Álava (Hacienda Foral)", cobertura: ninguna,
             aviso: "Calendario foral no verificado ni localizado. Solo se incluye la Seguridad Social.",
             enlace: "https://egoitza.araba.eus"}

